name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release creation
      id-token: write # OIDC for JSR + npm Trusted Publisher

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11.5.1 (minimum for OIDC Trusted Publishing)
        run: npm install -g npm@11.5.1

      - name: Install npm dependencies
        run: rm -rf node_modules && npm install

      - name: Build npm artifact
        run: npm run build:npm

      # Extract version once from deno.json; reused across all publish steps (DRY).
      - name: Extract version from deno.json
        id: extract_version
        run: |
          VERSION=$(deno eval --node-modules-dir=none "import cfg from './deno.json' with {type:'json'}; console.log(cfg.version)")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # Rewrite package.json version + exports for npm publish.
      # In the repo, exports point to .ts source (for local dev/tests). Here we switch to dist/.
      # This runs AFTER npm install + build so the lockfile matches during install.
      - name: Sync version and exports from deno.json → package.json
        run: |
          deno eval --node-modules-dir=none "
            import pkg from './package.json' with {type:'json'};
            import cfg from './deno.json' with {type:'json'};
            pkg.version = cfg.version;
            pkg.exports = {
              '.':              { import: './dist/mod.js',          types: './dist/mod.d.ts' },
              './react':        { import: './dist/react/hooks.js',  types: './dist/react/hooks.d.ts' },
              './server':       { import: './dist/server.js',       types: './dist/server.d.ts' },
              './server/build': { import: './dist/server-build.js', types: './dist/server-build.d.ts' },
              './link':         { import: './dist/cli/link.js',     types: './dist/cli/link.d.ts' },
            };
            await Deno.writeTextFile('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Publish to JSR
        run: |
          VERSION=${{ steps.extract_version.outputs.VERSION }}
          if curl -sf "https://registry.jsr.io/@goatdb/goatdb/$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already on JSR, skipping"
          else
            npx jsr publish --allow-dirty
          fi

      - name: Publish to npm
        run: |
          VERSION=${{ steps.extract_version.outputs.VERSION }}
          if curl -sf "https://registry.npmjs.org/@goatdb/goatdb/$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already on npm, skipping"
          elif [[ "$VERSION" == *"-"* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.extract_version.outputs.VERSION }}
          TAG=${GITHUB_REF_NAME}
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
          else
            gh release create "$TAG" \
              --title "v$VERSION" \
              --notes-file CHANGELOG.md \
              --verify-tag
          fi
