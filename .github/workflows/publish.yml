name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release creation
      id-token: write # OIDC for JSR + npm Trusted Publisher

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm 11.5.1 (minimum for OIDC Trusted Publishing)
        run: npm install -g npm@11.5.1

      - name: Install npm dependencies
        run: rm -rf node_modules && npm install

      - name: Build npm artifact
        run: npm run build:npm

      # This runs after npm install + build so the lockfile remains valid during install.
      - name: Prepare npm package manifest
        run: npm run prepare:npm-package

      - name: Publish to JSR
        run: npx jsr publish --allow-dirty

      - name: Publish to npm
        run: |
          VERSION=$(deno eval --node-modules-dir=none "import cfg from './deno.json' with {type:'json'}; console.log(cfg.version)")
          if [[ "$VERSION" == *"-"* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VERSION" \
            --notes-file CHANGELOG.md \
            --verify-tag
