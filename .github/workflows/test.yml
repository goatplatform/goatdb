name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('deno.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Static analysis (type check + module graph)
        run: deno check mod.ts

      - name: Run Deno tests
        run: deno task test --runtime=deno
        env:
          CI: true

      - name: Run Node.js tests
        run: deno task test --runtime=node
        env:
          CI: true

  build-npm:
    name: npm Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install npm dependencies
        run: npm install

      - name: Build npm package
        run: npm run build:npm

  test-browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('deno.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.playwright
          key: playwright-${{ runner.os }}-1.48.0-${{ hashFiles('deno.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-1.48.0-

      - name: Install Playwright browsers and system dependencies
        run: deno run -A npm:playwright@^1.48.0 install --with-deps chromium

      - name: Static analysis (type check + module graph)
        run: deno check mod.ts

      - name: Run TestRunner browser CLI coverage
        run: deno task test --runtime=deno --suite=TestRunner
        env:
          CI: true
          GOATDB_REQUIRE_PLAYWRIGHT: 'true'

      - name: Run browser tests
        run: deno task test --runtime=browser
        env:
          CI: true
