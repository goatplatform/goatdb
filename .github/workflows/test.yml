name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('deno.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'

      - name: Static analysis (type check + module graph)
        run: |
          deno check mod.ts
          deno check cli/debug-server.ts
          deno check cli/compile.ts
          deno check cli/init.ts
          deno check base/file-watcher.ts

      - name: Check formatting
        run: deno fmt --check

      - name: Run Deno tests
        run: deno task test --runtime=deno
        env:
          CI: true

      - name: Run Node.js tests
        run: deno task test --runtime=node
        env:
          CI: true

  build-npm:
    name: npm Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Exercise the published minimum separately from the latest Node 26 CI job.
          node-version: '26.0.0'

      - name: Install npm dependencies
        run: npm install

      - name: Build npm package
        run: npm run build:npm

      - name: Typecheck the packed npm email export
        run: |
          npm run prepare:npm-package
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          npm pack --pack-destination "$tmpdir"
          tarball=$(find "$tmpdir" -maxdepth 1 -name '*.tgz' -print -quit)
          mkdir "$tmpdir/consumer"
          cp .npmrc "$tmpdir/consumer/"
          npm install --prefix "$tmpdir/consumer" --ignore-scripts "$tarball"
          cat > "$tmpdir/consumer/index.ts" <<'EOF'
          import type { EmailMessage } from '@goatdb/goatdb/server/email';

          const message: EmailMessage = {
            to: [{ name: 'User', address: 'user@test.invalid' }],
            attachments: [{ filename: 'note.txt', content: new Uint8Array([1]) }],
            emailType: 'Login',
          };
          // @ts-expect-error recipients must be email addresses
          const invalidMessage: EmailMessage = { to: 42 };
          void [message, invalidMessage];
          EOF
          cat > "$tmpdir/consumer/tsconfig.json" <<'EOF'
          { "compilerOptions": { "module": "NodeNext", "moduleResolution": "NodeNext", "strict": true } }
          EOF
          ./node_modules/.bin/tsc --noEmit --project "$tmpdir/consumer/tsconfig.json"

  test-browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('deno.json') }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.x'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('base/playwright-version.ts') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers and system dependencies
        run: deno run -A npm:playwright@1.60.0 install --with-deps chromium

      - name: Static analysis (type check + module graph)
        run: |
          deno check mod.ts
          deno check cli/debug-server.ts
          deno check cli/compile.ts
          deno check cli/init.ts
          deno check base/file-watcher.ts

      - name: Check formatting
        run: deno fmt --check

      - name: Run TestRunner browser CLI coverage
        run: deno task test --runtime=deno --suite=TestRunner
        env:
          CI: true
          GOATDB_REQUIRE_PLAYWRIGHT: 'true'

      - name: Run browser tests
        run: deno task test --runtime=browser
        env:
          CI: true
