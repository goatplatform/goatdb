name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3 # floor: native explicit resource management (V8); see denoland/deno#29282

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Type check
        run: deno task check

      - name: Path contract pre-check
        run: deno task test:paths
        env:
          FC_SEED: 42

      - name: Runtime floor probe (TypeScript)
        run: deno eval 'using x = { [Symbol.dispose]() {} };'

      - name: Runtime floor probe (native JavaScript)
        # deno eval defaults to TypeScript; --ext=js guards the native JS path.
        run: deno eval --ext=js 'using x = { [Symbol.dispose]() {} };'

      - name: Run Deno tests
        run: deno task test --runtime=deno
        env:
          CI: true
          FC_SEED: 42

      - name: Run Node.js tests
        run: deno task test --runtime=node
        env:
          CI: true
          FC_SEED: 42

  package-validation:
    name: Package Archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3 # floor: native explicit resource management (V8); see denoland/deno#29282

      # Validates the JSR upload set and publish-time specifier rewriting
      # without publishing. The compile E2E links local source, so it cannot
      # cover this package-boundary contract.
      - name: Validate JSR package
        run: deno publish --dry-run

  system-assets-check:
    name: System Assets Freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3 # floor: native explicit resource management (V8); see denoland/deno#29282

      - name: Rebuild system assets
        run: deno task build

      - name: Verify system assets are fresh
        run: git diff --exit-code -- system-assets/assets.json

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3 # floor: native explicit resource management (V8); see denoland/deno#29282

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Typecheck docs
        run: npm --prefix docs run typecheck

      - name: Build docs
        run: deno task docs:build

  build-npm:
    name: npm Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3 # floor: native explicit resource management (V8); see denoland/deno#29282

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install npm dependencies
        run: npm install

      - name: Type check npm surface
        run: npm run check:npm-types

      - name: Build npm package
        run: npm run build:npm

      # Archive membership is checked on every push, not only at tag time.
      # Same verifier as publish, so a staging regression fails the PR.
      - name: Verify npm archive contents
        run: deno task verify:npm-archive

  build-contract:
    name: Build Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3 # floor: native explicit resource management (V8); see denoland/deno#29282

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install npm dependencies
        run: npm install

      # Builds the current checkout. The suite loads dist in place and must not
      # install the package or resolve it from a registry. `prefer-offline`
      # keeps the registry traffic down without failing on a dependency that
      # the cache does not hold yet.
      - name: Package contract
        run: deno task test:package
        env:
          GOATDB_TEST_PACKAGE: '1'
          npm_config_prefer_offline: 'true'

  test-browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.3.3 # floor: native explicit resource management (V8); see denoland/deno#29282

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('deno.json') }}
          restore-keys: |
            playwright-

      - name: Install Playwright browsers and system dependencies
        # Runs under Node, not Deno: Playwright's downloader passes a `lookup`
        # option that Deno's node:http does not implement. Tests still run on Deno.
        # Version comes from deno.json so the install and the test runner cannot drift.
        # deno.json must stay strict JSON (no comments): the probe reads it with require().
        run: |
          PLAYWRIGHT_VERSION=$(node -e "console.log(require('./deno.json').imports.playwright.split('@').pop().replace(/^[\^~]/, ''))")
          if [ -z "$PLAYWRIGHT_VERSION" ]; then
            echo '::error::Could not parse the playwright version from deno.json imports.playwright (expected e.g. npm:playwright@1.64.1)'
            exit 1
          fi
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium

      - name: Run browser tests
        run: deno task test --runtime=browser
        env:
          CI: true
