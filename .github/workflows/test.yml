name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - &setup-deno
        name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - &setup-node
        name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # WHY: deno.json is the Deno-side source of truth; package.json feeds the npm build.
      # A stale pin (historically esbuild ^0.25.4 vs 0.25.12) silently tests a different compiler than we publish with.
      - name: Check manifest pin drift
        run: >-
          deno eval --no-config 'const read=(f)=>JSON.parse(Deno.readTextFileSync(f));const d=read("deno.json"),p=read("package.json");for(const n of["esbuild","@deno/esbuild-plugin"]){const s=d.imports[n];const want=s.slice(s.lastIndexOf("@")+1);const raw=p.dependencies?.[n]??p.devDependencies?.[n]??"";const got=(raw.includes("@")?raw.slice(raw.lastIndexOf("@")+1):raw).replace(/^[~^]/,"");if(got!==want){console.error(n+" pin drift: deno.json="+want+" package.json="+raw);Deno.exit(1);}}'

      - name: Run Deno tests
        run: deno task test --runtime=deno

      - name: Run Node.js tests
        run: deno task test --runtime=node

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - *setup-deno

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Typecheck docs
        run: npm --prefix docs run typecheck

      - name: Build docs
        run: deno task docs:build

  build-npm:
    name: npm Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - *setup-node

      - name: Install npm dependencies
        run: npm install

      - name: Build npm package
        run: npm run build:npm

  test-browser:
    name: Browser Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - *setup-deno

      - *setup-node

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('deno.json') }}
          restore-keys: |
            playwright-

      - name: Install Playwright browsers and system dependencies
        run: |
          PLAYWRIGHT=$(deno eval --no-config "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).imports.playwright)")
          deno run -A "$PLAYWRIGHT" install --with-deps chromium

      - name: Run browser tests
        run: deno task test --runtime=browser
        env:
          CI: true
